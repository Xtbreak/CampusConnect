name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CampusConnect-Windows
          - os: macos-15
            artifact: CampusConnect-macOS-arm64
          - os: macos-15-intel
            artifact: CampusConnect-macOS-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build macOS (ad-hoc signed, not notarized)
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./.venv-build/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/SHA256-*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Windows 与 macOS 校园网客户端。
          macOS：arm64 适用于 Apple 芯片；x86_64 适用于 Intel。
          自动构建的 macOS 包仅作 ad-hoc 签名，未经 Apple 公证，首次打开可能被系统拦截。
          正式分发前请参照 docs/macos.md 完成 Developer ID 签名与公证，并替换附件。
          校园网实际认证需要在学校有线网络内验收。
          NOTES
          gh release create "$RELEASE_TAG" artifacts/* --draft --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
